name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: chensokolovsky/sandblaster_26
          ref: 3dc6582f7f7d137adaa115f635eb5fc8e8da91f5
          path: _upstream
      - run: python -m pip install -r requirements-test.lock
      - run: python -m pip install -e .
      - run: python -m pytest -q -p no:cacheprovider
      - run: python checks/compare_upstream.py --upstream-root _upstream
      - run: python -m build
      - run: python -m venv .consumer
      - run: .consumer/bin/python -m pip install dist/*.whl
      - run: .consumer/bin/python -I checks/consume_installation.py
