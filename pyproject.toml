[build-system]
requires=["setuptools==80.10.2", "wheel==0.48.0"]
build-backend="setuptools.build_meta"
[project]
name="policymosaic"
version="1.0.7"
maintainers=[{name="dhtfish98"}]
description="PolicyMosaic attributed derivative for offline developer analysis"
readme="项目文档/README.md"
requires-python=">=3.9"
license="BSD-3-Clause"
license-files=["项目文档/LICENSE"]
dependencies=["tqdm==4.70.1", "unicorn==2.1.4", "setuptools==80.10.2"]
[project.optional-dependencies]
test=["pytest"]
[project.scripts]
"policymosaic"="policymosaic.launcher:mosaic_main"
[tool.setuptools.packages.find]
where=["src"]
[tool.setuptools.package-data]
"*"=["*.codes", "data/*.json", "data/*.config"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["checks"]

[tool.setuptools.cmdclass]
build_py="policymosaic_delivery_build.DeliveryBuild"

[tool.setuptools]
py-modules=["policymosaic_delivery_build"]

[tool.setuptools.data-files]
"share/policymosaic"=["项目文档/ORIGIN.md","项目文档/DEFENSIVE_SCOPE.md","项目文档/VALIDATION.md","项目文档/CURRENT_VALIDATION.json","项目文档/SOURCE_AUDIT.json"]
