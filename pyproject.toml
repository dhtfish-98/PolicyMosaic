[build-system]
requires=["setuptools==80.10.2", "wheel==0.48.0"]
build-backend="setuptools.build_meta"
[project]
name="policymosaic"
version="1.0.1"
description="PolicyMosaic attributed derivative for offline developer analysis"
readme="README.md"
requires-python=">=3.9"
license={file="LICENSE"}
dependencies=["tqdm==4.70.1", "unicorn==2.0.1.post1", "setuptools==80.10.2"]
[project.optional-dependencies]
test=["pytest"]
[project.scripts]
"policymosaic"="policymosaic.launcher:mosaic_main"
[tool.setuptools.packages.find]
where=["src"]
[tool.setuptools.package-data]
"*"=["*.codes", "data/*.json", "data/*.config"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["checks"]

[tool.setuptools.cmdclass]
build_py="policymosaic_delivery_build.DeliveryBuild"

[tool.setuptools]
py-modules=["policymosaic_delivery_build"]
